<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { background: #2a78d6; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px;
           font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  #msg { color: #52514e; font-size: 13px; margin-left: 10px; }
</style>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>
<button id="btn" disabled>Loading…</button><span id="msg"></span>
<script>
// Minimal Streamlit component protocol (same messages streamlit-component-lib sends).
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
}
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");
let handler = null, token = null;
const CLOSED = 52, OPEN = 720;

function setValue(v) { send("streamlit:setComponentValue", { value: v, dataType: "json" }); }

function setup(linkToken, label) {
  if (typeof Plaid === "undefined") {
    btn.textContent = "Bank connection unavailable";
    msg.textContent = "Could not load Plaid Link (check your internet connection).";
    return;
  }
  token = linkToken;
  handler = Plaid.create({
    token: linkToken,
    onSuccess: function (publicToken, metadata) {
      send("streamlit:setFrameHeight", { height: CLOSED });
      setValue({ public_token: publicToken,
                 institution: metadata && metadata.institution ? metadata.institution.name : null });
      btn.disabled = true; btn.textContent = "Connected ✓";
    },
    onExit: function (err) {
      send("streamlit:setFrameHeight", { height: CLOSED });
      if (err) setValue({ error: err.display_message || err.error_message || "Cancelled" });
    }
  });
  btn.disabled = false;
  btn.textContent = label || "Connect your bank";
}

btn.addEventListener("click", function () {
  if (!handler) return;
  send("streamlit:setFrameHeight", { height: OPEN });  // room for the Plaid popup
  handler.open();
});

window.addEventListener("message", function (event) {
  const d = event.data || {};
  if (d.type !== "streamlit:render") return;
  const args = d.args || {};
  if (args.link_token && args.link_token !== token) setup(args.link_token, args.label);
});

send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: CLOSED });
</script>
</body>
</html>
