name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  postgres:
    name: Tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finagent
          POSTGRES_PASSWORD: finagent
          POSTGRES_DB: finagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finagent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - name: Test against Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://finagent:finagent@localhost:5432/finagent
        run: pytest

  docker:
    name: Docker Compose (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        env:
          LLM_PROVIDER: none
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:8000/health
          curl -fsS -F file=@sample_data/bank_statement_cafe.csv -F use_llm=false \
            http://localhost:8000/uploads/statement | grep -q '"imported":337'
          curl -fsS http://localhost:8000/reports/summary | grep -q '"net_profit":34792.73'
          curl -fsS -X POST http://localhost:8000/chat -H 'Content-Type: application/json' \
            -d '{"question":"What are our biggest expenses?","use_llm":false}' | grep -q Payroll
          curl -fsS -o /dev/null http://localhost:8000/export/tax-pack.pdf
          curl -fsS http://localhost:8501/_stcore/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
